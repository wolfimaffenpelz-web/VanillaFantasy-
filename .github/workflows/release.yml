name: Publish alpha shaderpack
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      EGL_PLATFORM: surfaceless
      PYOPENGL_PLATFORM: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and install dependencies
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
          python -m pip install -r requirements-test.txt
      - name: Validate and build
        run: |
          python scripts/validate.py
          python scripts/gl_test.py --report-dir work/test-report
          python scripts/build.py
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/*.sha256 work/test-report/validation.json
          --title "Warm Fantasy Vanilla+ $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES.md --prerelease
